# Agentic Wallet Policy Engine — default demo policy
# This file is baked into the Docker image at build time and is IMMUTABLE at
# runtime. Changing policy requires a new deployment (new on-chain digest).

[limits]
max_per_tx  = "0.1"    # ETH per single transaction
daily_cap   = "1.0"    # ETH per rolling 24h window
monthly_cap = "10.0"   # ETH per rolling 30d window

[whitelist]
# Only these contracts may be called. Raw ETH transfers to EOAs are governed by
# allow_eoa below.
contracts = [
  "0x7a250d5630B4cF539739dF2C5dAcb4c659F2488D", # Uniswap V2 Router
  "0xd9e1cE17f2641f24aE83637ab66a2cca9C378B9F", # SushiSwap Router
]
allow_eoa = false      # block raw ETH transfers to externally owned accounts

[selectors]
# 4-byte function selectors the agent is permitted to call.
allowed = [
  "0x38ed1739", # swapExactTokensForTokens
  "0x7ff36ab5", # swapExactETHForTokens
  "0x095ea7b3", # approve
]

[alerts]
webhook            = ""     # optional Slack/Discord webhook for violations
on_violation       = true
on_daily_threshold = 0.8    # alert at 80% of daily cap

# ---------------------------------------------------------------------------
# x402 agentic-commerce payment policy (the v2 signing gateway).
# AWPE holds the signing key; an agent forwards a merchant's 402 "accept" and
# AWPE signs the EIP-3009 USDC authorization ONLY if it passes these rules.
# ---------------------------------------------------------------------------
[payments]
max_per_payment_usdc = "5.0"    # cap on any single x402 payment
daily_budget_usdc    = "50.0"   # rolling 24h budget across all payments

# Allowed settlement networks (CAIP-2). Base + Base Sepolia.
networks = ["eip155:8453", "eip155:84532"]

# Allowed payment assets — USDC only (Base mainnet + Base Sepolia contracts).
assets = [
  "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913", # USDC on Base
  "0x036CbD53842c5426634e7929541eC2318f3dCF7e", # USDC on Base Sepolia
]

# Allowlisted merchant settlement addresses (the `payTo` from the 402 challenge).
# A prompt-injected agent that tries to pay any address NOT in this list gets
# refused at the signer — it never had the key. Populate with the real merchant
# addresses captured from fetch_quote.
payees = [
  "0x209693Bc6afc0C5328bA36FaF03C514EF312287C", # demo merchant (stablemerch)
]
